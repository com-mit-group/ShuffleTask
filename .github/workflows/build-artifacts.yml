name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g., 1.0.0). Leave empty to use the tag this workflow runs on.'
        type: string
        required: false

permissions: {}

concurrency:
  group: build-artifacts-${{ github.repository }}-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      build-status: ${{ steps.build-status.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: set-version
        shell: pwsh
        run: |
          $manualVersion = "${{ github.event.inputs.version }}"
          if (-not [string]::IsNullOrWhiteSpace($manualVersion)) {
            $version = $manualVersion
            Write-Host "Using manual version: $version"
          } elseif ("${{ github.ref }}" -like "refs/tags/*") {
            $tagVersion = "${{ github.ref }}".Substring(10)
            $version = $tagVersion -replace '^v', ''
            Write-Host "Using tag version: $tagVersion -> $version"
          } else {
            throw "Version input is required when the workflow is not run from a tag."
          }

          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
          Set-Content -Path ./artifacts/VERSION.txt -Value $version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "VersionPrefix=$version" >> $env:GITHUB_ENV

          $parts = $version.Split('.')
          if ($parts.Length -ne 3) {
            throw "Semantic version '$version' must contain major, minor, and patch segments."
          }

          $numberStyles = [System.Globalization.NumberStyles]::None
          $culture = [System.Globalization.CultureInfo]::InvariantCulture

          $major = 0
          $minor = 0
          $patch = 0

          if (-not [int]::TryParse($parts[0], $numberStyles, $culture, [ref]$major) -or
              -not [int]::TryParse($parts[1], $numberStyles, $culture, [ref]$minor) -or
              -not [int]::TryParse($parts[2], $numberStyles, $culture, [ref]$patch)) {
            throw "Semantic version '$version' contains non-numeric segments."
          }

          $majorLimit = 2147
          $minorLimit = 483
          $patchLimit = 647

          if ($major -gt $majorLimit -or $minor -gt $minorLimit -or $patch -gt $patchLimit) {
            throw "Semantic version '$version' exceeds Android version code limits (major <= $majorLimit, minor <= $minorLimit, patch <= $patchLimit)."
          }

          $androidVersionCode = ($major * 1000000) + ($minor * 1000) + $patch
          echo "AndroidVersionCode=$androidVersionCode" >> $env:GITHUB_ENV
          echo "android_version_code=$androidVersionCode" >> $env:GITHUB_OUTPUT

      - name: Check for existing build artifacts
        id: check-artifacts
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $version = "${{ steps.set-version.outputs.version }}"
          $expected = @(
            "build-$version-windows-unsigned",
            "build-$version-android-unsigned",
            "build-$version-metadata"
          )

          $response = gh api "repos/$repo/actions/artifacts?per_page=100" | ConvertFrom-Json
          $artifacts = @()
          if ($null -ne $response.artifacts) { $artifacts = $response.artifacts }

          $existing = $artifacts | Where-Object { $_.name -in $expected -and $_.expired -eq $false } | Select-Object -ExpandProperty name -Unique

          if ($existing.Count -eq $expected.Count) {
            Write-Host "✓ Build artifacts already exist for version $version"
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No complete build artifact set found for version $version. Proceeding with build."
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Set up .NET 10 SDK
        if: steps.check-artifacts.outputs.exists == 'false'
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore cached .NET workloads
        if: steps.check-artifacts.outputs.exists == 'false'
        id: restore-dotnet-workloads
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            'C:\Program Files\dotnet\packs'
            'C:\Program Files\dotnet\sdk-manifests'
            C:\ProgramData\dotnet\workload*
            'C:\Program Files\dotnet\metadata'
          key: ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-${{ hashFiles('**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-
            ${{ runner.os }}-dotnet-

      - name: Restore cached Android SDK
        if: steps.check-artifacts.outputs.exists == 'false'
        id: restore-android-sdk
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ${{ env.ANDROID_SDK_ROOT }}
            C:\Users\runneradmin\.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install MAUI workload
        if: steps.check-artifacts.outputs.exists == 'false' && steps.restore-dotnet-workloads.outputs.cache-hit != 'true'
        run: dotnet workload install maui --skip-manifest-update

      - name: Install Android SDK components
        if: steps.check-artifacts.outputs.exists == 'false' && steps.restore-android-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "tools"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to install Android SDK components"
            exit 1
          }

      - name: Save .NET workloads cache
        if: steps.check-artifacts.outputs.exists == 'false' && steps.restore-dotnet-workloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            'C:\Program Files\dotnet\packs'
            'C:\Program Files\dotnet\sdk-manifests'
            C:\ProgramData\dotnet\workload*
            'C:\Program Files\dotnet\metadata'
          key: ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-${{ hashFiles('**/global.json') }}

      - name: Save Android SDK cache
        if: steps.check-artifacts.outputs.exists == 'false' && steps.restore-android-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ${{ env.ANDROID_SDK_ROOT }}
            C:\Users\runneradmin\.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/global.json') }}

      - name: Configure GitHub Packages
        if: steps.check-artifacts.outputs.exists == 'false'
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.YARE92_NUGET_TOKEN }}
        run: bash scripts/ci-configure-nuget.sh

      - name: Restore Windows runtime packs
        if: steps.check-artifacts.outputs.exists == 'false'
        run: >-
          dotnet restore ShuffleTask.Presentation/ShuffleTask.Presentation.csproj
          -r win-x64
          /p:TargetFrameworks=net10.0-windows10.0.19041.0
          /p:SelfContained=true

      - name: Restore dependencies
        if: steps.check-artifacts.outputs.exists == 'false'
        run: dotnet restore ShuffleTask.sln

      - name: Build Windows self-contained executable
        if: steps.check-artifacts.outputs.exists == 'false'
        run: >-
          dotnet publish ShuffleTask.Presentation/ShuffleTask.Presentation.csproj
          -c Release
          -r win-x64
          --self-contained true
          -f net10.0-windows10.0.19041.0
          -o ./artifacts/win
          /p:UseMonoRuntime=false
          /p:AssemblyVersion=${{ steps.set-version.outputs.version }}

      - name: Build Android APK
        if: steps.check-artifacts.outputs.exists == 'false'
        run: >-
          dotnet publish ShuffleTask.Presentation/ShuffleTask.Presentation.csproj
          -c Release
          -f net10.0-android
          /p:AndroidPackageFormat=apk
          /p:ApplicationVersion=${{ steps.set-version.outputs.android_version_code }}
          -o ./artifacts/android

      - name: Normalize artifact names
        if: steps.check-artifacts.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.set-version.outputs.version }}"

          $winOutput = Get-ChildItem 'artifacts/win' -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $winOutput) { throw 'Windows publish output missing expected .exe file.' }
          $winName = "ShuffleTask-$version-unsigned.exe"
          Rename-Item -Path $winOutput.FullName -NewName $winName -Force
          Write-Host "Renamed Windows artifact to: $winName"

          $apkOutput = Get-ChildItem 'artifacts/android' -Filter *.apk | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apkOutput) { throw 'Android publish output missing expected .apk file.' }
          $apkName = "ShuffleTask-$version-unsigned.apk"
          Rename-Item -Path $apkOutput.FullName -NewName $apkName -Force
          Write-Host "Renamed Android artifact to: $apkName"

      - name: Upload Windows artifact
        if: steps.check-artifacts.outputs.exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: build-${{ steps.set-version.outputs.version }}-windows-unsigned
          path: artifacts/win/*.exe
          if-no-files-found: error

      - name: Upload Android artifact
        if: steps.check-artifacts.outputs.exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: build-${{ steps.set-version.outputs.version }}-android-unsigned
          path: artifacts/android/*.apk
          if-no-files-found: error

      - name: Upload metadata
        if: steps.check-artifacts.outputs.exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: build-${{ steps.set-version.outputs.version }}-metadata
          path: artifacts/VERSION.txt
          if-no-files-found: error

      - name: Record build status
        id: build-status
        if: always()
        shell: pwsh
        run: |
          if ("${{ job.status }}" -ne "success") {
            echo "status=failed" >> $env:GITHUB_OUTPUT
          } elseif ("${{ steps.check-artifacts.outputs.exists }}" -eq "true") {
            echo "status=skipped" >> $env:GITHUB_OUTPUT
          } else {
            echo "status=success" >> $env:GITHUB_OUTPUT
          }

  summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Build Pipeline Summary"
            echo
            echo "**Version:** ${{ needs.build.outputs.version }}"
            echo "**Status:** ${{ needs.build.outputs.build-status }}"
            echo
            if [ "${{ needs.build.outputs.build-status }}" == "skipped" ]; then
              echo "✓ Build artifacts already exist for this version."
              echo
              echo "Artifacts: \`build-${{ needs.build.outputs.version }}-windows-unsigned\`, \`build-${{ needs.build.outputs.version }}-android-unsigned\`, and \`build-${{ needs.build.outputs.version }}-metadata\`."
            elif [ "${{ needs.build.outputs.build-status }}" == "success" ]; then
              echo "✓ Build completed successfully."
              echo
              echo "Artifacts uploaded with names prefixed by \`build-${{ needs.build.outputs.version }}\`."
            else
              echo "✗ Build status unknown or failed."
            fi
            echo
            echo "### Next Steps"
            echo "Run the **Sign Artifacts** workflow with version: \`${{ needs.build.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
