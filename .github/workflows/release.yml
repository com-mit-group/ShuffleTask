name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g., 1.0.0)'
        type: string
        required: true
      notes:
        description: 'Release notes (optional)'
        type: string
        required: false

permissions: {}

concurrency:
  group: release-${{ github.repository }}-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ github.event.inputs.version }}
      release-status: ${{ steps.release-status.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate trusted version tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            echo "Version is required. Please provide a semantic version (e.g., 1.0.0)" >&2
            exit 1
          fi

          TAG="v$VERSION"
          git fetch --force --tags origin
          if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "Trusted version tag '$TAG' does not exist. Version advancement must complete after successful main CI before release publication." >&2
            exit 1
          fi

          echo "Processing trusted version: $TAG"

      - name: Check if release already exists
        id: check-release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          TAG="v$VERSION"
          echo "Checking for existing release for tag: $TAG"

          if gh release view "$TAG" &>/dev/null; then
            echo "✓ Release already exists for $TAG"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing release found"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check if signed artifacts exist
        if: steps.check-release.outputs.exists == 'false'
        id: check-signed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $version = "${{ github.event.inputs.version }}"
          $expected = @(
            "signed-$version-windows",
            "signed-$version-android",
            "signed-$version-metadata"
          )

          $response = gh api "repos/$repo/actions/artifacts?per_page=100" | ConvertFrom-Json
          $artifacts = @()
          if ($null -ne $response.artifacts) { $artifacts = $response.artifacts }

          $windowsArtifact = $artifacts | Where-Object { $_.name -eq $expected[0] -and $_.expired -eq $false } | Select-Object -First 1
          $androidArtifact = $artifacts | Where-Object { $_.name -eq $expected[1] -and $_.expired -eq $false } | Select-Object -First 1
          $metadataArtifact = $artifacts | Where-Object { $_.name -eq $expected[2] -and $_.expired -eq $false } | Select-Object -First 1

          if (-not $windowsArtifact -or -not $androidArtifact -or -not $metadataArtifact) {
            Write-Host "✗ Signed artifacts not found for version $version"
            Write-Host "Ensure the Sign Artifacts workflow has been completed for this version."
            throw "Signed artifacts missing."
          }

          echo "windows_url=$($windowsArtifact.archive_download_url)" >> $env:GITHUB_OUTPUT
          echo "android_url=$($androidArtifact.archive_download_url)" >> $env:GITHUB_OUTPUT
          echo "metadata_url=$($metadataArtifact.archive_download_url)" >> $env:GITHUB_OUTPUT

          Write-Host "✓ Signed artifacts found for version $version"

      - name: Download signed artifacts
        if: steps.check-release.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseRoot = Join-Path (Get-Location) 'artifacts/release'
          if (Test-Path $releaseRoot) { Remove-Item $releaseRoot -Recurse -Force }
          $windowsTarget = Join-Path $releaseRoot 'win-x64'
          $androidTarget = Join-Path $releaseRoot 'android-arm64'
          New-Item -ItemType Directory -Force -Path $windowsTarget, $androidTarget | Out-Null

          $winZip = Join-Path $env:RUNNER_TEMP 'signed-windows.zip'
          $androidZip = Join-Path $env:RUNNER_TEMP 'signed-android.zip'
          $metadataZip = Join-Path $env:RUNNER_TEMP 'signed-metadata.zip'

          $headers = @{
            'Authorization' = "Bearer $env:GH_TOKEN"
            'Accept' = 'application/vnd.github+json'
          }

          Invoke-WebRequest -Uri "${{ steps.check-signed.outputs.windows_url }}" -Headers $headers -OutFile $winZip
          Invoke-WebRequest -Uri "${{ steps.check-signed.outputs.android_url }}" -Headers $headers -OutFile $androidZip
          Invoke-WebRequest -Uri "${{ steps.check-signed.outputs.metadata_url }}" -Headers $headers -OutFile $metadataZip

          Expand-Archive -Path $winZip -DestinationPath $windowsTarget -Force
          Expand-Archive -Path $androidZip -DestinationPath $androidTarget -Force
          Expand-Archive -Path $metadataZip -DestinationPath $releaseRoot -Force

          Remove-Item $winZip, $androidZip, $metadataZip -Force
          Get-ChildItem -Path ./artifacts/release -Recurse

      - name: Validate standardized release inputs
        if: steps.check-release.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $releaseRoot = Join-Path (Get-Location) 'artifacts/release'
          $windowsDir = Join-Path $releaseRoot 'win-x64'
          $androidDir = Join-Path $releaseRoot 'android-arm64'
          $versionFile = Join-Path $releaseRoot 'VERSION.txt'
          $winZip = Join-Path $windowsDir "ShuffleTask-$version-windows.zip"
          $apkFile = Join-Path $androidDir "ShuffleTask-$version.apk"

          if (-not (Test-Path $winZip)) { throw "Complete Windows deployment archive missing at artifacts/release/win-x64/ShuffleTask-$version-windows.zip" }
          if (-not (Test-Path $apkFile)) { throw "Signed Android APK missing at artifacts/release/android-arm64/ShuffleTask-$version.apk" }
          if (-not (Test-Path $versionFile)) { throw "VERSION.txt missing at $versionFile" }

          Write-Host "Validated standardized release inputs:"
          Write-Host "  Windows ZIP: $([System.IO.Path]::GetRelativePath((Get-Location).Path, $winZip))"
          Write-Host "  Android APK: $([System.IO.Path]::GetRelativePath((Get-Location).Path, $apkFile))"
          Write-Host "  VERSION.txt: $([System.IO.Path]::GetRelativePath((Get-Location).Path, $versionFile))"

      - name: Create release notes
        if: steps.check-release.outputs.exists == 'false'
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          USER_NOTES="${{ github.event.inputs.notes }}"

          cat > release-notes.md << EOF
          # ShuffleTask v$VERSION

          $USER_NOTES

          ## Installation

          ### Windows
          Download \`ShuffleTask-$VERSION-windows.zip\`, extract the contents, and run the ShuffleTask executable from the unpacked folder.

          ### Android
          Download \`ShuffleTask-$VERSION.apk\` and install it on your Android device. You may need to enable "Install from unknown sources" in your device settings.

          ## What's Changed

          See the full repository history for changes included in this release.

          ---

          *Built on $(date -u '+%Y-%m-%d %H:%M:%S UTC')*
          EOF

          echo "Release notes created"

      - name: Create GitHub Release
        if: steps.check-release.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          TAG="v$VERSION"
          echo "Creating GitHub release for trusted tag: $TAG"

          gh release create "$TAG" \
            --verify-tag \
            --title "ShuffleTask v$VERSION" \
            --notes-file release-notes.md \
            ./artifacts/release/win-x64/ShuffleTask-$VERSION-windows.zip \
            ./artifacts/release/android-arm64/ShuffleTask-$VERSION.apk \
            ./artifacts/release/VERSION.txt

          echo "✓ Release created successfully"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mark release status
        id: release-status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.check-release.outputs.exists }}" = "true" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip message
        if: steps.check-release.outputs.exists == 'true'
        shell: bash
        run: |
          echo "================================================"
          echo "Release already exists for v${{ github.event.inputs.version }}"
          echo "Skipping release creation."
          echo "To create a new release, use a different trusted version."
          echo "================================================"

  summary:
    runs-on: ubuntu-latest
    needs: release
    if: always()
    steps:
      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Release Pipeline Summary"
            echo
            echo "**Version:** ${{ needs.release.outputs.version }}"
            echo "**Status:** ${{ needs.release.outputs.release-status }}"
            echo
            if [ "${{ needs.release.outputs.release-status }}" == "success" ]; then
              echo "✓ Release created successfully."
              echo
              echo "**Release tag:** \`v${{ needs.release.outputs.version }}\`"
              echo
              echo "The release is now public and available for download."
            elif [ "${{ needs.release.outputs.release-status }}" == "skipped" ]; then
              echo "✓ Release already exists for this version."
              echo
              echo "**Release tag:** \`v${{ needs.release.outputs.version }}\`"
            else
              echo "✗ Release failed or status unknown."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
