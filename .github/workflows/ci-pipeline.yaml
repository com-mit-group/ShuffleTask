name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Shared workflow policy
    uses: yaron-E92/AutoDev/.github/workflows/profile-baseline.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      require_concurrency: true
    permissions:
      contents: read

  version-intent:
    name: Version intent
    if: github.event_name == 'pull_request'
    uses: yaron-E92/AutoDev/.github/workflows/version-intent.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      pr_body: ${{ github.event.pull_request.body }}
      head: ${{ github.sha }}
    permissions:
      contents: read

  headless:
    name: Headless .NET validation
    needs: [baseline]
    uses: yaron-E92/AutoDev/.github/workflows/profile-dotnet.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      runner: windows-latest
      global_json_file: ''
      dotnet_version: 10.0.202
      setup_command: bash scripts/ci-configure-nuget.sh
      restore_command: dotnet restore ShuffleTask.NoGUI.slnf
      build_command: dotnet build ShuffleTask.NoGUI.slnf --configuration Debug --no-restore
      test_command: |
        set -euo pipefail
        mkdir -p artifacts/ci/headless
        dotnet test ShuffleTask.NoGUI.slnf \
          --configuration Debug \
          --no-build \
          --no-restore \
          --logger 'trx;LogFilePrefix=headless' \
          --results-directory artifacts/ci/headless \
          --collect:'XPlat Code Coverage;Format=opencover' \
          --verbosity normal
      test_results_path: artifacts/ci/headless/**
      artifact_name: shuffletask-headless-results
    secrets:
      nuget_token: ${{ secrets.YARE92_NUGET_TOKEN }}
    permissions:
      contents: read
      packages: read

  maui:
    name: MAUI product validation
    needs: [baseline]
    uses: yaron-E92/AutoDev/.github/workflows/profile-maui.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      global_json_file: ''
      dotnet_version: 10.0.202
      headless_enabled: false

      android_enabled: true
      android_runner: ubuntu-latest
      android_setup_command: |
        bash scripts/ci-configure-nuget.sh
        dotnet workload install maui-android --skip-manifest-update
      android_restore_command: dotnet restore ShuffleTask.Presentation/ShuffleTask.Presentation.csproj --runtime android-arm64
      android_build_command: dotnet build ShuffleTask.Presentation/ShuffleTask.Presentation.csproj --configuration Release --framework net10.0-android --runtime android-arm64 --no-restore
      android_test_command: find ShuffleTask.Presentation/bin/Release/net10.0-android -type f -name 'ShuffleTask.Presentation.dll' -print -quit | grep -q .

      windows_enabled: true
      windows_runner: windows-latest
      windows_setup_command: |
        bash scripts/ci-configure-nuget.sh
        dotnet workload install maui-windows --skip-manifest-update
      windows_restore_command: dotnet restore ShuffleTask.Presentation/ShuffleTask.Presentation.csproj --runtime win-x64 -p:ShuffleTaskWindowsOnly=true
      windows_build_command: dotnet build ShuffleTask.Presentation/ShuffleTask.Presentation.csproj --configuration Release --framework net10.0-windows10.0.19041.0 --runtime win-x64 --no-restore -p:ShuffleTaskWindowsOnly=true -p:WindowsPackageType=None -p:UseMonoRuntime=false
      windows_test_command: |
        set -euo pipefail
        find ShuffleTask.Presentation/bin/Release/net10.0-windows10.0.19041.0 -type f -name 'ShuffleTask.Presentation.dll' -print -quit | grep -q .
        mkdir -p artifacts/ci/maui-windows
        dotnet test ShuffleTask.Presentation.Tests/ShuffleTask.Presentation.Tests.csproj \
          --configuration Release \
          --logger 'trx;LogFilePrefix=presentation' \
          --results-directory artifacts/ci/maui-windows \
          --verbosity normal
      windows_test_results_path: artifacts/ci/maui-windows/**
    secrets:
      nuget_token: ${{ secrets.YARE92_NUGET_TOKEN }}
    permissions:
      contents: read
      packages: read

  ci-gate:
    name: CI gate
    if: always()
    needs: [baseline, version-intent, headless, maui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require version policy and product validation
        shell: bash
        env:
          BASELINE: ${{ needs.baseline.result }}
          VERSION_INTENT: ${{ needs.version-intent.result }}
          HEADLESS: ${{ needs.headless.result }}
          MAUI: ${{ needs.maui.result }}
        run: |
          set -euo pipefail
          if [[ "$BASELINE" != 'success' ||
                "$HEADLESS" != 'success' ||
                "$MAUI" != 'success' ]]; then
            echo "Required CI failed: baseline=$BASELINE headless=$HEADLESS maui=$MAUI" >&2
            exit 1
          fi

          if [[ "$VERSION_INTENT" != 'success' && "$VERSION_INTENT" != 'skipped' ]]; then
            echo "Version intent validation failed: $VERSION_INTENT" >&2
            exit 1
          fi

          echo 'ShuffleTask authoritative CI passed.'

  version-tag:
    name: Advance version tag
    needs: [ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success'
    uses: yaron-E92/AutoDev/.github/workflows/version-tag.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      head: ${{ github.sha }}
      branch: main
    permissions:
      contents: write
      pull-requests: read
